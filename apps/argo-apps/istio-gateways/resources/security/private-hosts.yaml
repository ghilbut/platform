apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: private-hosts
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            remoteIpBlocks:
              - 192.168.254.0/24
      to:
        - operation:
            hosts:
              - id.ghilbut.com
              - id.ghilbut.com:*
              - argo.ghilbut.com
              - argo.ghilbut.com:*
              - vault.ghilbut.com
              - vault.ghilbut.com:*
