apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: coredns
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: datastore
    app.kubernetes.io/name: coredns
spec:
  clusterIP: None
  ports:
    - name: client
      port: 2379
      targetPort: client
    - name: peer
      port: 2380
      targetPort: peer
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: datastore
    app.kubernetes.io/name: coredns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: coredns
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: datastore
    app.kubernetes.io/name: coredns
spec:
  replicas: 1
  serviceName: etcd
  selector:
    matchLabels:
      app.kubernetes.io/component: datastore
      app.kubernetes.io/name: coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/component: datastore
        app.kubernetes.io/name: coredns
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.6.14
          args:
            - /usr/local/bin/etcd
            - --name=etcd-0
            - --data-dir=/etcd-data
            - --log-level=warn
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd-0.etcd.coredns.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd-0.etcd.coredns.svc.cluster.local:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd.coredns.svc.cluster.local:2380
            - --initial-cluster-state=new
          env:
            - name: ETCDCTL_API
              value: "3"
          ports:
            - name: client
              containerPort: 2379
              protocol: TCP
            - name: peer
              containerPort: 2380
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/etcdctl
                - --endpoints=http://127.0.0.1:2379
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/etcdctl
                - --endpoints=http://127.0.0.1:2379
                - endpoint
                - health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /etcd-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-etcd-0
        - name: tmp
          emptyDir: {}
