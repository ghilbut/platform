apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-etcd-0
  namespace: coredns
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    app.kubernetes.io/component: datastore
    app.kubernetes.io/name: coredns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-lvm
