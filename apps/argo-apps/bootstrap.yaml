apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: cilium
            stage: cilium
            targetNamespace: kube-system
          - name: istio-system
            stage: istio-system
            targetNamespace: istio-system
          - name: istio-gateways
            stage: istio-gateways
            targetNamespace: istio-gateways
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argo
      labels:
        ghilbut.com/bootstrap-stage: '{{ .stage }}'
    spec:
      destination:
        name: in-cluster
        namespace: '{{ .targetNamespace }}'
      project: default
  templatePatch: |
    {{- if eq .name "cilium" }}
    spec:
      source:
        chart: cilium
        repoURL: https://helm.cilium.io/
        targetRevision: 1.20.0
        helm:
          releaseName: cilium
          valueFiles:
            - values.yaml
          values: |
            k8sServiceHost: 192.168.254.4
            k8sServicePort: 6443
            cluster:
              name: gw
              id: 1
            hubble:
              metrics:
                enabled:
                  - dns:query;ignoreAAAA
                  - drop
                  - tcp
                  - flow
                  - icmp
                  - http
              relay:
                enabled: true
                rollOutPods: true
              ui:
                enabled: true
            ipam:
              operator:
                clusterPoolIPv4PodCIDRList: 172.31.0.0/16
            kubeProxyReplacement: true
            l7Proxy: false
            operator:
              replicas: 1
            clustermesh:
              useAPIServer: true
              enableEndpointSliceSynchronization: true
              mcsapi:
                enabled: true
      syncPolicy:
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - Validate=true
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: cilium-ca
          jsonPointers:
            - /data/ca.crt
            - /data/ca.key
        - group: ""
          kind: Secret
          name: clustermesh-apiserver-admin-cert
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          name: clustermesh-apiserver-local-cert
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          name: clustermesh-apiserver-remote-cert
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          name: clustermesh-apiserver-server-cert
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          name: hubble-relay-client-certs
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          name: hubble-server-certs
          jsonPointers:
            - /data/ca.crt
            - /data/tls.crt
            - /data/tls.key
    {{- else if eq .name "istio-system" }}
    spec:
      sources:
        - chart: base
          repoURL: https://istio-release.storage.googleapis.com/charts
          targetRevision: 1.30.3
          helm:
            releaseName: istio-base
            values: |
              defaultRevision: default
        - chart: istiod
          repoURL: https://istio-release.storage.googleapis.com/charts
          targetRevision: 1.30.3
          helm:
            releaseName: istiod
            values: |
              autoscaleEnabled: false
              replicaCount: 1
              seccompProfile:
                type: RuntimeDefault
              sidecarInjectorWebhook:
                enableNamespacesByDefault: false
        - path: apps/argo-apps/istio-system
          repoURL: https://github.com/ghilbut/platform.git
          targetRevision: main
      syncPolicy:
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - Validate=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
          jsonPointers:
            - /webhooks/0/failurePolicy
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
          jsonPointers:
            - /webhooks/0/failurePolicy
    {{- else if eq .name "istio-gateways" }}
    spec:
      sources:
        - chart: gateway
          repoURL: https://istio-release.storage.googleapis.com/charts
          targetRevision: 1.30.3
          helm:
            releaseName: istio-ingressgateway
            values: |
              name: istio-ingressgateway
              annotations:
                argocd.argoproj.io/sync-wave: "0"
              labels:
                app: istio-ingressgateway
                istio: ingressgateway
              autoscaling:
                enabled: false
              replicaCount: 1
              service:
                externalTrafficPolicy: Local
                type: LoadBalancer
              securityContext:
                sysctls:
                  - name: net.ipv4.ip_unprivileged_port_start
                    value: "0"
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
        - path: apps/argo-apps/istio-gateways
          repoURL: https://github.com/ghilbut/platform.git
          targetRevision: main
          directory:
            recurse: true
      syncPolicy:
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - Validate=true
    {{- end }}
  syncPolicy:
    applicationsSync: create-update
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: ghilbut.com/bootstrap-stage
              operator: In
              values:
                - cilium
          maxUpdate: 1
        - matchExpressions:
            - key: ghilbut.com/bootstrap-stage
              operator: In
              values:
                - istio-system
          maxUpdate: 1
        - matchExpressions:
            - key: ghilbut.com/bootstrap-stage
              operator: In
              values:
                - istio-gateways
          maxUpdate: 1
