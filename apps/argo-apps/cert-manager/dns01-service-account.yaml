apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-dns01
  namespace: istio-gateways
  annotations:
    argocd.argoproj.io/sync-wave: "1"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-dns01-tokenrequest
  namespace: istio-gateways
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - cert-manager-dns01
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-dns01-tokenrequest
  namespace: istio-gateways
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-dns01-tokenrequest
