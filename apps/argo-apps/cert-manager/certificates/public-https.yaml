apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-https
  namespace: istio-gateways
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  dnsNames:
    - id.ghilbut.com
    - vault.ghilbut.com
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: aws-route53
  secretName: public-https-tls
