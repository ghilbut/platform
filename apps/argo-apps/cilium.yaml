apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.20.0
    helm:
      releaseName: cilium
      valueFiles:
        - values.yaml
      values: |
        k8sServiceHost: 192.168.254.4
        k8sServicePort: 6443
        cluster:
          name: gw
          id: 1
        hubble:
          metrics:
            enabled:
              - dns:query;ignoreAAAA
              - drop
              - tcp
              - flow
              - icmp
              - http
          relay:
            enabled: true
            rollOutPods: true
          ui:
            enabled: true
        ipam:
          operator:
            clusterPoolIPv4PodCIDRList: 172.31.0.0/16
        kubeProxyReplacement: true
        l7Proxy: false
        operator:
          replicas: 1
        clustermesh:
          useAPIServer: true
          enableEndpointSliceSynchronization: true
          mcsapi:
            enabled: true
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - Validate=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-admin-cert
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-local-cert
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-remote-cert
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-server-cert
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
