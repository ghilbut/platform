apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argo
spec:
  project: default
  source:
    path: apps/argo-apps/coredns
    repoURL: https://github.com/ghilbut/platform.git
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: coredns
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
      - Validate=true
