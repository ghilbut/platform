name: Upload CDN error pages to S3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aws-cdn-error-pages.yml
      - aws/cdn/404.html
      - aws/cdn/503.html

concurrency:
  group: cdn-error-pages-deploy
  cancel-in-progress: false

jobs:
  upload:
    name: Upload error pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_IAM_ROLE_CDN_GITHUB_ACTIONS_ARN }}
          disable-retry: true

      - name: Upload error pages to S3
        run: |
          aws s3 cp 404.html s3://ghilbut-cloudfront-cdn/404.html \
            --content-type "text/html; charset=utf-8"
          aws s3 cp 503.html s3://ghilbut-cloudfront-cdn/503.html \
            --content-type "text/html; charset=utf-8"
        working-directory: aws/cdn
